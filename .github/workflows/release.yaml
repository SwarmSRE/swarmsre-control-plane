name: Release SwarmSRE

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-rc') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Package Helm Chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package charts/swarmsre-server/ --version $VERSION --app-version $VERSION
          
      - name: Push Helm Chart to GHCR (OCI)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          helm push swarmsre-server-${VERSION}.tgz oci://${{ env.REGISTRY }}/${OWNER}/charts
          
      - name: Sign Helm Chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ${{ env.REGISTRY }}/${OWNER}/charts/swarmsre-server:${VERSION}

      - name: Generate static install.yaml
        run: |
          helm template swarmsre charts/swarmsre-server/ --namespace swarmsre-system --set config.openaiApiKey=REPLACE_ME > install.yaml

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::500345929632:role/swarmsre-github-actions-role
          aws-region: us-east-1

      - name: Publish Script to S3 (CDN)
        run: |
          aws s3 cp scripts/install.sh s3://get-swarmsre-app-installer/index \
            --content-type "text/plain" \
            --cache-control "max-age=300"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: install.yaml
          generate_release_notes: true
          prerelease: ${{ contains(github.ref, '-rc') || startsWith(github.ref, 'refs/tags/v0.') }}
