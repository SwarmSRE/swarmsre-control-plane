services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: swarmsre-postgres
    environment:
      POSTGRES_USER: swarmsre
      POSTGRES_PASSWORD: swarmsre-dev
      POSTGRES_DB: swarmsre
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmsre"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
