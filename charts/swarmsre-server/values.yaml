image:
  repository: ghcr.io/swarmsre/swarmsre-control-plane
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

# SwarmSRE specific configuration
config:
  # The URL to the PostgreSQL database. If postgresql.enabled is true, this is automatically configured.
  databaseUrl: ""
  # Required: OpenAI API key for the AI agents
  openaiApiKey: ""
  # Optional: Slack webhook for notifications
  slackWebhookUrl: ""

# Bundled PostgreSQL for quickstart/PoC environments
postgresql:
  enabled: true
  persistence:
    size: 1Gi

rbac:
  create: true

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
