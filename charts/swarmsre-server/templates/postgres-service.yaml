{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "swarmsre-server.fullname" . }}-postgres
  labels:
    {{- include "swarmsre-server.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app: {{ include "swarmsre-server.fullname" . }}-postgres
{{- end }}
