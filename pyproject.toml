[project]
name = "swarmsre-control-plane"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abdallah Gabr", email = "a.amin.gabr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "kubernetes>=30.0.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.57",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
swarmsre-control-plane = "swarmsre_control_plane:main"

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
